:root{--ink:#25292E;--muted:#616972;--blue:#6495ED;--deep:#234F9E;--pale:#EAF0FC;--paper:#F7F6F2;--line:#DCE0E5;--night:#15171C;--sky:#B5CCF9;--soft:#CED6E0}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--deep)}
a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 36px}
.narrow{max-width:900px}
.brand{font-family:"Jost",sans-serif;font-weight:300;text-transform:uppercase;letter-spacing:.16em;font-synthesis:none}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:750;color:var(--deep);margin-bottom:14px}
.dark-eyebrow{color:var(--sky)}

/* Top bar */
.top{position:sticky;top:0;z-index:10;background:var(--night);border-bottom:1px solid #2A2E36}
.top-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:block;line-height:0}
.logo svg{height:40px;width:auto}
.top nav{display:flex;gap:26px;font-size:13px}
.top nav a{color:var(--soft);text-decoration:none;white-space:nowrap}
.top nav a:hover{color:#fff}
.menu-btn{display:none;width:44px;height:44px;margin-right:-10px;padding:0;border:0;background:none;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menu-btn span{display:block;width:22px;height:2px;border-radius:2px;background:#fff;transition:transform .2s,opacity .2s}
.menu-btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top.open .menu-btn span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.top.open .menu-btn span:nth-child(2){opacity:0}
.top.open .menu-btn span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* Hero */
.hero{background:var(--night);color:#fff;padding:96px 0 88px}
.hero h1{font-size:clamp(28px,4.6vw,60px);line-height:1.24;max-width:1080px}
.hero h1 span{color:var(--blue)}
.lede{font-size:21px;color:var(--soft);max-width:720px;margin-top:28px}
.hero-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:36px}
.hp{text-decoration:none;font-size:14px;font-weight:600;padding:9px 16px;border-radius:9px}
.hp-pl{background:#fff;color:var(--ink)}
.hp-pa{background:var(--deep);color:#fff}
.hp-ma{background:var(--pale);color:var(--ink)}

/* Sections */
.section{padding:76px 0 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:28px}
.section-head>p{max-width:440px;color:var(--muted)}
h2{font-size:clamp(30px,4vw,48px);font-weight:620;letter-spacing:-.04em;line-height:1.12}
h3{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.lead{font-size:21px;line-height:1.5;max-width:900px;margin-bottom:28px}

/* Pillars */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pil{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ph{padding:24px 26px 22px}
.ph h3{font-size:26px}
.ph span{display:block;margin-top:6px;font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.pil-pl .ph{background:var(--ink);color:#fff}
.pil-pa .ph{background:var(--deep);color:#fff}
.pil-ma .ph{background:var(--pale);color:var(--ink)}
.pil dl{margin:0}
.pil dt{padding:16px 26px 4px;border-top:1px solid var(--line);font-size:10px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pil dd{margin:0;padding:0 26px 16px;font-size:15px}
.connect{margin-top:34px;padding-top:26px;border-top:1px solid var(--line);max-width:900px}
.connect h3{margin-bottom:10px}

/* Platform stack */
.stack{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 26px}
.tier{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.tier:first-child{border-top:0}
.tier-label{font-weight:500;font-size:17px;letter-spacing:-.02em;padding-top:10px}
.cells{display:flex;gap:10px}
.cell{flex:1;text-align:center;padding:13px 10px;border-radius:9px;font-weight:600;font-size:14px}
.cell-pale{background:var(--pale);color:var(--deep);border:1px solid #C9D7F5}
.cell-deep{background:var(--deep);color:#fff}
.cell-wide{font-weight:500}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.layers{list-style:none;counter-reset:l;margin:0;padding:0;background:var(--ink);border-radius:12px;overflow:hidden}
.layers li{counter-increment:l;display:grid;grid-template-columns:34px 230px 1fr;gap:10px;padding:15px 18px;border-top:1px solid #3A3F47;color:#fff}
.layers li:first-child{border-top:0}
.layers li::before{content:counter(l);color:var(--sky);font-size:13px}
.layers b{font-weight:500}
.layers span{color:var(--soft);font-size:15px}
.tagpill{display:flex;margin-top:26px;border-radius:999px;overflow:hidden}
.tagpill span{flex:1;text-align:center;padding:20px 16px;font-size:15px;letter-spacing:.12em}
.tp-l{background:var(--ink);color:#fff}
.tp-r{background:var(--blue);color:var(--ink);font-weight:400}

/* Flow */
.flow{display:grid;grid-template-columns:1fr 28px 1.1fr 28px 1fr 28px 1fr;align-items:stretch}
.col{display:flex;flex-direction:column}
.col-label{font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:var(--deep);margin-bottom:12px}
.arrow{position:relative}
.arrow::after{content:"";position:absolute;left:5px;right:3px;top:56%;border-top:2px solid var(--deep)}
.arrow::before{content:"";position:absolute;right:2px;top:calc(56% - 5px);border:6px solid transparent;border-left:8px solid var(--deep);border-right:0;transform:translateY(-1px)}
.sig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.sig:last-child{margin-bottom:0}
.sig b,.it b,.panel-deep b,.panel-light b{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
.sig span{font-size:14px;color:var(--muted)}
.panel-dark,.panel-deep,.panel-light{flex:1;border-radius:16px;padding:20px 20px}
.panel-dark{background:var(--ink);color:#fff}
.it{padding:12px 0;border-top:1px solid #3A3F47}
.it:first-child{border-top:0;padding-top:0}
.it span{font-size:14px;color:var(--soft)}
.panel-deep{background:var(--deep);color:#fff}
.panel-deep ul,.panel-light ul{list-style:none;margin:12px 0 0;padding:0}
.panel-deep li{padding:10px 0;border-top:1px solid #3E66B3;font-size:15px}
.fine{display:block;margin-top:14px;font-size:13px;color:var(--sky)}
.panel-light{background:#fff;border:1px solid var(--line)}
.panel-light li{padding:8px 0 8px 16px;position:relative;font-size:15px}
.panel-light li::before{content:"";position:absolute;left:0;top:16px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.loops{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.loop{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:9px;font-size:14px}
.loop-solid{background:var(--pale);color:var(--deep);border:1px solid #C9D7F5}
.loop-dash{border:1px dashed var(--muted);color:var(--muted)}
.loop-icon{font-size:18px;line-height:1}
.evidence{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.evidence table{border-collapse:collapse;width:100%}
.evidence th,.evidence td{text-align:left;vertical-align:top;padding:12px 12px 12px 0;border-bottom:1px solid var(--line);font-size:15px}
.evidence th{width:150px;font-weight:600}

/* Working together */
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}
.card p{font-size:15px}
.card p+p{margin-top:12px}
.rule{border-top:3px solid var(--ink);padding-top:14px;margin-bottom:16px}
.rule-pa{border-color:var(--deep)}
.rule-ma{border-color:var(--blue)}
.qs{margin:0}
.qs dt{font-weight:600;font-size:15px}
.qs dd{margin:2px 0 14px;font-size:15px;color:var(--muted)}

/* Origin */
.origin{font-size:20px;line-height:1.55}

/* Contact */
.contact{background:var(--night);color:#fff;padding:80px 0;margin-top:76px}
.contact h2{color:#fff;font-size:clamp(24px,3vw,36px);font-weight:500;letter-spacing:-.02em;max-width:900px;line-height:1.25}
.contact-row{margin-top:30px}
.btn{display:inline-block;background:var(--blue);color:var(--ink);text-decoration:none;font-weight:600;padding:12px 20px;border-radius:9px}
.btn:hover{background:#7FA8F2}
.lead-eyebrow{margin-top:44px}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:0}
.links a{flex:1;min-width:220px;max-width:340px;border:1px solid #2F343D;border-radius:16px;padding:18px 20px;text-decoration:none;color:#fff}
.links a:hover{border-color:var(--blue)}
.links b{display:block;font-weight:600}
.prod-link{margin-top:28px;font-size:15px;color:var(--soft)}
.prod-link a{color:var(--sky)}
.links span{font-size:14px;color:var(--soft)}
.foot{background:var(--night);color:var(--soft);border-top:1px solid #2A2E36;font-size:13px}
.foot a{color:var(--soft)}
.foot a:hover{color:#fff}
.admin-link{display:inline-block;vertical-align:middle;margin-left:12px;line-height:0;border-radius:50%;opacity:.8;transition:opacity .15s}
.admin-link:hover,.admin-link:focus-visible{opacity:1}
.admin-link img{display:block;width:32px;height:32px}
.foot-inner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:22px;padding-bottom:22px}

/* Responsive */
@media (max-width:980px){
  .flow{grid-template-columns:1fr;gap:0}
  .arrow{height:32px}
  .arrow::after{left:50%;right:auto;top:4px;bottom:6px;border-top:0;border-left:2px solid var(--deep)}
  .arrow::before{left:calc(50% - 5px);right:auto;top:auto;bottom:0;border:6px solid transparent;border-top:8px solid var(--deep);border-bottom:0;transform:none}
  .layers li{grid-template-columns:28px 1fr}
  .layers span{grid-column:2}
}
@media (max-width:720px){
  .wrap{padding:0 18px}
  .menu-btn{display:flex}
  .top nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;padding:4px 18px 14px;background:var(--night);border-bottom:1px solid #2A2E36;box-shadow:0 12px 24px rgba(0,0,0,.25)}
  .top.open nav{display:flex}
  .top nav a{padding:14px 0;font-size:17px;color:#fff;border-top:1px solid #2A2E36}
  .top nav a:first-child{border-top:0}
  .logo svg{height:32px}
  .hero{padding:56px 0 52px}
  .lede{font-size:18px}
  .section{padding-top:50px}
  .section-head{display:block}
  .section-head>p{margin-top:12px}
  .pillars,.two{grid-template-columns:1fr}
  .tier{grid-template-columns:1fr;gap:10px}
  .tier-label{padding-top:0}
  .cells{flex-direction:column}
  .tagpill{flex-direction:column;border-radius:16px}
  .tagpill span{font-size:13px;padding:14px 12px}
  .lead,.origin{font-size:18px}
  .evidence th{width:96px}
  .contact{padding:56px 0;margin-top:50px}
}


/* Sub-pages */
.page{padding:72px 0 96px}
.page h1{font-size:clamp(34px,5vw,56px);font-weight:620;letter-spacing:-.04em;line-height:1.08}
.page-intro{font-size:19px;line-height:1.55;color:var(--muted);max-width:720px;margin-top:18px}
.pbtn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:9px;transition:background .2s}
.pbtn:hover{background:var(--deep)}
.pbtn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Pay */
.pbtn-lg{font-size:17px;padding:16px 28px;border-radius:11px}
.pbtn-outline{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.pbtn-outline:hover{background:var(--ink);color:#fff}
.feature-card{display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center;margin-top:40px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 36px;box-shadow:inset 0 4px 0 var(--blue),0 10px 30px rgba(37,41,46,.06)}
.feature-eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:750;color:var(--deep)}
.feature-card h2{margin-top:10px;font-size:clamp(28px,3.4vw,38px);font-weight:620;letter-spacing:-.03em;line-height:1.1}
.feature-desc{margin-top:14px;font-size:17px;line-height:1.55;color:var(--ink);max-width:520px}
.feature-note{margin-top:12px;font-size:14px;color:var(--muted)}
.feature-action{text-align:center}
.feature-hint{margin-top:10px;font-size:13px;color:var(--muted)}
.request{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-top:18px;padding:22px 28px;border:1px dashed #C3CAD3;border-radius:18px}
.request h2{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.request p{margin-top:6px;font-size:15px;color:var(--muted);max-width:520px}
.request .pbtn{flex-shrink:0}
.plans-head{margin-top:64px;display:flex;justify-content:space-between;align-items:end;gap:20px}
.plans-head h2{font-size:clamp(24px,3vw,32px)}
.plans-head p{color:var(--muted);font-size:15px}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
.pay-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px 24px}
.pay-card.monthly{box-shadow:inset 0 3px 0 var(--blue)}
.pay-card h3{font-size:19px;font-weight:500;letter-spacing:-.01em;line-height:1.3}
.pay-card .price{margin-top:8px;color:var(--ink);font-size:32px;font-weight:620;letter-spacing:-.03em;line-height:1.1}
.price small{font-size:15px;font-weight:400;letter-spacing:0;color:var(--muted)}
.lead-line{margin-top:14px;font-size:15px;line-height:1.5;color:var(--ink)}
.incl{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--line)}
.incl li{position:relative;padding-left:16px;font-size:14px;color:var(--muted);line-height:1.5}
.incl li+li{margin-top:7px}
.incl li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.terms-line{margin-top:14px;padding-bottom:22px;font-size:13px;color:var(--muted)}
.pay-card .pbtn{margin-top:auto;align-self:flex-start}
.next{margin-top:56px}
.next h2{font-size:clamp(22px,2.6vw,28px)}
.next ol{list-style:none;counter-reset:n;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.next li{counter-increment:n;padding-top:14px;border-top:2px solid var(--ink)}
.next li::before{content:counter(n);display:block;font-size:13px;font-weight:700;color:var(--deep);margin-bottom:6px}
.next b{display:block;font-weight:600;font-size:16px}
.next span{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.account{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;margin-top:56px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 34px}
.account h2{margin-top:10px;font-size:clamp(22px,2.6vw,28px)}
.account-desc{margin-top:12px;font-size:15px;line-height:1.6;color:var(--muted)}
.account .pbtn{margin-top:22px}
.account-list{padding-left:32px;border-left:1px solid var(--line)}
.account-list-title{font-size:14px;font-weight:600}
.account-list .incl{margin-top:4px;border-top:0;padding-top:8px}
.account-list .incl li{font-size:15px}
.small-print{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.small-print a{color:var(--muted)}

/* Thanks */
.thanks .pbtn{margin-top:32px}

/* Legal */
.updated{margin-top:14px;font-size:14px;color:var(--muted)}
.toc{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.toc a{text-decoration:none;font-size:14px;font-weight:600;padding:9px 16px;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.toc a:hover{border-color:var(--blue)}
.legal-sec{margin-top:56px;padding-top:36px;border-top:1px solid var(--line)}
.legal-sec h2{font-size:clamp(26px,3.4vw,36px)}
.legal-sec h3{font-size:18px;font-weight:600;margin-top:30px}
.legal-sec p,.legal-sec li{font-size:16px;line-height:1.65}
.legal-sec p{margin-top:10px}
.legal-sec ul{margin:10px 0 0;padding-left:22px}
.legal-sec li+li{margin-top:6px}

@media (max-width:980px){
  .pay-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .page{padding:44px 0 64px}
  .page-intro{font-size:17px}
  .feature-card{grid-template-columns:1fr;gap:22px;padding:28px 22px}
  .feature-action{text-align:left}
  .pbtn-lg{display:block;text-align:center}
  .request{flex-direction:column;align-items:flex-start;gap:16px;padding:20px 22px}
  .plans-head{display:block;margin-top:48px}
  .plans-head p{margin-top:6px}
  .pay-grid{grid-template-columns:1fr;gap:16px}
  .pay-card{padding:24px 22px 22px}
  .pay-card .price{font-size:30px}
  .next ol{grid-template-columns:1fr;gap:14px}
  .account{grid-template-columns:1fr;gap:24px;padding:26px 22px}
  .account-list{padding-left:0;padding-top:22px;border-left:0;border-top:1px solid var(--line)}
}
