<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Poonam — Happy Mother's Day 2026</title>

    <link rel="icon" type="image/x-icon" href="../favicons/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Great+Vibes&family=Dancing+Script:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --blush-50:  #fff5f8;
            --blush-100: #ffe8ef;
            --blush-200: #ffd4e0;
            --blush-300: #f9b8c8;
            --blush-400: #ec90a8;
            --rose:      #d56b85;
            --rose-deep: #b04866;
            --blue-100:  #eaf6fc;
            --blue-200:  #cfe9f5;
            --blue-300:  #aedbed;
            --leaf:      #8fa777;
            --leaf-deep: #5e7a4a;
            --ink:       #5b3142;
            --ink-soft:  #8a5e6e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            color: var(--ink);
            min-height: 100vh;
            position: relative;
            background:
                radial-gradient(ellipse 50% 40% at 12% 8%,  rgba(249, 184, 200, 0.55) 0%, transparent 70%),
                radial-gradient(ellipse 45% 35% at 92% 18%, rgba(174, 219, 237, 0.55) 0%, transparent 70%),
                radial-gradient(ellipse 55% 40% at 88% 92%, rgba(249, 184, 200, 0.55) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 8% 88%,  rgba(174, 219, 237, 0.45) 0%, transparent 70%),
                linear-gradient(180deg, #fff3f7 0%, #fdeaf2 50%, #f3f9fc 100%);
        }

        /* Paper grain */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            opacity: 0.06;
            mix-blend-mode: multiply;
        }

        /* Watercolor blobs (subtle background washes) */
        .wash {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }
        .wash.tl { top: -8vh; left: -10vw; width: 55vw; height: 55vw; background: radial-gradient(circle at 35% 35%, rgba(249, 184, 200, 0.9), transparent 65%); }
        .wash.tr { top: -5vh; right: -10vw; width: 45vw; height: 45vw; background: radial-gradient(circle at 60% 40%, rgba(174, 219, 237, 0.85), transparent 65%); }
        .wash.bl { bottom: -10vh; left: -12vw; width: 60vw; height: 60vw; background: radial-gradient(circle at 50% 50%, rgba(249, 184, 200, 0.85), transparent 65%); }
        .wash.br { bottom: -8vh; right: -8vw; width: 40vw; height: 40vw; background: radial-gradient(circle at 50% 50%, rgba(174, 219, 237, 0.7), transparent 65%); }

        /* Floral corners */
        .floral {
            position: fixed;
            pointer-events: none;
            z-index: 2;
        }
        .floral svg { display: block; width: 100%; height: 100%; }

        .floral.top-right {
            top: 0;
            right: 0;
            width: min(440px, 38vw);
            height: min(440px, 38vw);
            transform-origin: top right;
            animation: sway 9s ease-in-out infinite;
        }

        .floral.bottom-left {
            bottom: 0;
            left: 0;
            width: min(520px, 44vw);
            height: min(520px, 44vw);
            transform-origin: bottom left;
            animation: sway 11s ease-in-out infinite reverse;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(1.5deg); }
        }

        /* Falling petals */
        .petals {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            top: -40px;
            opacity: 0;
            will-change: transform, opacity;
        }
        .petal svg { width: 100%; height: 100%; display: block; }

        @keyframes fall1 {
            0%   { transform: translate(0, -10vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.85; }
            100% { transform: translate(8vw, 110vh) rotate(360deg); opacity: 0; }
        }
        @keyframes fall2 {
            0%   { transform: translate(0, -10vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.8; }
            100% { transform: translate(-12vw, 110vh) rotate(-420deg); opacity: 0; }
        }
        @keyframes fall3 {
            0%   { transform: translate(0, -10vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.9; }
            50%  { transform: translate(4vw, 50vh) rotate(180deg); }
            100% { transform: translate(-6vw, 110vh) rotate(540deg); opacity: 0; }
        }

        /* Floating hearts (subtle) */
        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            opacity: 0;
            will-change: transform, opacity;
        }
        .heart svg { width: 100%; height: 100%; display: block; }

        @keyframes drift1 {
            0%   { transform: translate(0, 110vh) rotate(-6deg) scale(0.85); opacity: 0; }
            15%  { opacity: 0.55; }
            85%  { opacity: 0.5; }
            100% { transform: translate(8vw, -15vh) rotate(4deg) scale(1); opacity: 0; }
        }
        @keyframes drift2 {
            0%   { transform: translate(0, 115vh) rotate(8deg) scale(0.9); opacity: 0; }
            15%  { opacity: 0.5; }
            85%  { opacity: 0.45; }
            100% { transform: translate(-10vw, -20vh) rotate(-6deg) scale(1.05); opacity: 0; }
        }
        @keyframes drift3 {
            0%   { transform: translate(0, 105vh) rotate(0deg) scale(1); opacity: 0; }
            15%  { opacity: 0.6; }
            85%  { opacity: 0.5; }
            100% { transform: translate(5vw, -10vh) rotate(10deg) scale(0.9); opacity: 0; }
        }

        /* Main content */
        main {
            position: relative;
            z-index: 4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem;
            text-align: center;
        }

        .card {
            max-width: 880px;
            width: 100%;
            padding: 4.5rem 3rem;
            position: relative;
        }

        /* Thin elegant inner frame, like the inspiration */
        .frame {
            position: absolute;
            inset: 1.25rem;
            border: 1px solid rgba(176, 72, 102, 0.35);
            pointer-events: none;
        }
        .frame::before, .frame::after {
            content: '';
            position: absolute;
            background: rgba(176, 72, 102, 0.5);
        }
        /* tiny corner marks */
        .frame::before {
            top: -4px; left: -4px; width: 9px; height: 9px;
            border-top: 1px solid rgba(176, 72, 102, 0.6);
            border-left: 1px solid rgba(176, 72, 102, 0.6);
            background: transparent;
        }
        .frame::after {
            bottom: -4px; right: -4px; width: 9px; height: 9px;
            border-bottom: 1px solid rgba(176, 72, 102, 0.6);
            border-right: 1px solid rgba(176, 72, 102, 0.6);
            background: transparent;
        }

        .occasion {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: clamp(0.85rem, 1.5vw, 1.05rem);
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: var(--rose-deep);
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeUp 1.2s ease-out 0.2s forwards;
        }

        .lead {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 400;
            color: var(--ink-soft);
            font-size: clamp(1.2rem, 2.2vw, 1.5rem);
            letter-spacing: 0.04em;
            margin-bottom: 0.2rem;
            opacity: 0;
            animation: fadeUp 1.2s ease-out 0.5s forwards;
        }

        h1.hero-name {
            font-family: 'Pinyon Script', cursive;
            font-weight: 400;
            font-size: clamp(4rem, 13vw, 9rem);
            line-height: 1.05;
            letter-spacing: 0;
            background: linear-gradient(135deg, var(--rose-deep) 0%, var(--rose) 50%, var(--blue-300) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeUp 1.4s ease-out 0.8s forwards;
            padding: 0.1em 0;
        }

        .divider {
            width: 80px;
            height: 1px;
            background: rgba(176, 72, 102, 0.4);
            margin: 0 auto 2.5rem;
            position: relative;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.2s forwards;
        }
        .divider::before {
            content: '❀';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #fff3f7, #fdeaf2);
            padding: 0 0.6em;
            color: var(--rose);
            font-size: 0.9rem;
        }

        .message {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            color: var(--ink);
            font-size: clamp(1.3rem, 2.6vw, 1.7rem);
            line-height: 1.7;
            margin: 0 auto 2.5rem;
            max-width: 640px;
            font-style: italic;
        }

        .message p {
            opacity: 0;
            transform: translateY(14px);
            animation: fadeUp 1.2s ease-out forwards;
            margin-bottom: 1rem;
        }

        .message p:nth-child(1) { animation-delay: 1.5s; }
        .message p:nth-child(2) { animation-delay: 2.1s; }
        .message p:nth-child(3) { animation-delay: 2.7s; }
        .message p:nth-child(4) { animation-delay: 3.3s; }

        .message .accent {
            font-family: 'Great Vibes', cursive;
            font-style: normal;
            color: var(--rose-deep);
            font-size: 1.35em;
            line-height: 1;
            display: inline-block;
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.6rem, 3vw, 2.1rem);
            color: var(--rose-deep);
            margin-top: 2rem;
            opacity: 0;
            animation: fadeUp 1.2s ease-out 4.0s forwards;
            line-height: 1.2;
        }

        .signature::before {
            content: '— ';
            opacity: 0.5;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            main { padding: 4rem 1rem; }
            .card { padding: 3rem 1.5rem; }
            .frame { inset: 0.5rem; }
            .floral.top-right { width: 50vw; height: 50vw; }
            .floral.bottom-left { width: 60vw; height: 60vw; }
        }

        @media (prefers-reduced-motion: reduce) {
            .floral, .heart, .heart svg, .petal { animation: none !important; }
            .occasion, .lead, h1, .divider, .message p, .signature {
                opacity: 1 !important;
                transform: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="wash tl"></div>
    <div class="wash tr"></div>
    <div class="wash bl"></div>
    <div class="wash br"></div>

    <!-- Top-right magnolia branch -->
    <div class="floral top-right" aria-hidden="true">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="petalA" cx="35%" cy="30%">
                    <stop offset="0%" stop-color="#fff5f8" stop-opacity="0.95"/>
                    <stop offset="55%" stop-color="#f9c4d2" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#ec90a8" stop-opacity="0.75"/>
                </radialGradient>
                <radialGradient id="petalB" cx="40%" cy="35%">
                    <stop offset="0%" stop-color="#fff5f8" stop-opacity="0.9"/>
                    <stop offset="60%" stop-color="#fbd0db" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#f0a3b8" stop-opacity="0.7"/>
                </radialGradient>
            </defs>

            <!-- Stem/branch -->
            <path d="M 400 30 C 340 60, 280 90, 230 130 C 200 155, 175 180, 165 210"
                  fill="none" stroke="#6b5447" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
            <path d="M 380 50 C 360 70, 345 80, 330 95"
                  fill="none" stroke="#6b5447" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

            <!-- Small leaf -->
            <path d="M 320 100 C 335 95, 355 100, 360 115 C 350 120, 330 118, 320 110 Z"
                  fill="#a8b88f" opacity="0.7" stroke="#5e7a4a" stroke-width="1"/>
            <path d="M 320 100 L 360 115" stroke="#5e7a4a" stroke-width="0.8" opacity="0.6" fill="none"/>

            <!-- Magnolia bloom 1 (open, near corner) -->
            <g transform="translate(295, 95) rotate(15)">
                <!-- back petals -->
                <path d="M 0 -55 C -28 -50, -42 -25, -32 0 C -18 -8, -8 -25, 0 -45 Z"
                      fill="url(#petalA)" stroke="#a8536a" stroke-width="0.9" opacity="0.85"/>
                <path d="M 0 -55 C 28 -50, 42 -25, 32 0 C 18 -8, 8 -25, 0 -45 Z"
                      fill="url(#petalA)" stroke="#a8536a" stroke-width="0.9" opacity="0.85"/>
                <!-- side petals -->
                <path d="M -45 -10 C -55 5, -50 30, -30 38 C -22 22, -25 5, -38 -8 Z"
                      fill="url(#petalB)" stroke="#a8536a" stroke-width="0.9" opacity="0.9"/>
                <path d="M 45 -10 C 55 5, 50 30, 30 38 C 22 22, 25 5, 38 -8 Z"
                      fill="url(#petalB)" stroke="#a8536a" stroke-width="0.9" opacity="0.9"/>
                <!-- front petal -->
                <path d="M 0 5 C -22 12, -28 35, -10 50 C 0 45, 10 45, 20 50 C 32 35, 22 12, 0 5 Z"
                      fill="url(#petalA)" stroke="#a8536a" stroke-width="1" opacity="0.95"/>
                <!-- center -->
                <ellipse cx="0" cy="-2" rx="6" ry="9" fill="#c8a35a" opacity="0.9"/>
                <line x1="0" y1="-12" x2="0" y2="6" stroke="#8a6a3a" stroke-width="0.8"/>
            </g>

            <!-- Bud at branch tip -->
            <g transform="translate(170, 215) rotate(-10)">
                <path d="M 0 0 C -12 -8, -10 -28, 0 -35 C 10 -28, 12 -8, 0 0 Z"
                      fill="url(#petalB)" stroke="#a8536a" stroke-width="0.9" opacity="0.85"/>
                <path d="M -2 -32 C -1 -38, 1 -38, 2 -32" stroke="#5e7a4a" stroke-width="1" fill="none"/>
            </g>
        </svg>
    </div>

    <!-- Bottom-left magnolia bloom -->
    <div class="floral bottom-left" aria-hidden="true">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="petalC" cx="35%" cy="30%">
                    <stop offset="0%" stop-color="#fff5f8" stop-opacity="0.95"/>
                    <stop offset="55%" stop-color="#f9c4d2" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#ec90a8" stop-opacity="0.75"/>
                </radialGradient>
                <radialGradient id="petalD" cx="40%" cy="35%">
                    <stop offset="0%" stop-color="#fff5f8" stop-opacity="0.9"/>
                    <stop offset="60%" stop-color="#fbd0db" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#f0a3b8" stop-opacity="0.7"/>
                </radialGradient>
                <radialGradient id="petalE" cx="50%" cy="40%">
                    <stop offset="0%" stop-color="#ffeef3" stop-opacity="0.9"/>
                    <stop offset="100%" stop-color="#e89eb1" stop-opacity="0.6"/>
                </radialGradient>
            </defs>

            <!-- Soft watercolor blob behind -->
            <ellipse cx="120" cy="320" rx="160" ry="120" fill="#f9c4d2" opacity="0.25"/>

            <!-- Curving stem/branch -->
            <path d="M 0 380 C 60 350, 110 320, 150 280 C 175 255, 195 235, 210 220"
                  fill="none" stroke="#6b5447" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

            <!-- Leaf -->
            <path d="M 60 360 C 30 365, 5 355, -5 340 C 20 332, 50 340, 65 355 Z"
                  fill="#a8b88f" opacity="0.65" stroke="#5e7a4a" stroke-width="1"/>

            <!-- Large open magnolia -->
            <g transform="translate(140, 290) rotate(-15)">
                <!-- back layer petals -->
                <path d="M 0 -85 C -45 -80, -65 -40, -50 -5 C -28 -15, -12 -38, 0 -70 Z"
                      fill="url(#petalC)" stroke="#a8536a" stroke-width="1.1" opacity="0.85"/>
                <path d="M 0 -85 C 45 -80, 65 -40, 50 -5 C 28 -15, 12 -38, 0 -70 Z"
                      fill="url(#petalC)" stroke="#a8536a" stroke-width="1.1" opacity="0.85"/>

                <!-- side petals -->
                <path d="M -70 -20 C -88 5, -80 50, -50 60 C -38 38, -42 12, -60 -15 Z"
                      fill="url(#petalD)" stroke="#a8536a" stroke-width="1.1" opacity="0.9"/>
                <path d="M 70 -20 C 88 5, 80 50, 50 60 C 38 38, 42 12, 60 -15 Z"
                      fill="url(#petalD)" stroke="#a8536a" stroke-width="1.1" opacity="0.9"/>

                <!-- front petals -->
                <path d="M -25 0 C -50 18, -55 58, -25 72 C -12 65, -5 65, 0 70 Z"
                      fill="url(#petalE)" stroke="#a8536a" stroke-width="1.1" opacity="0.92"/>
                <path d="M 25 0 C 50 18, 55 58, 25 72 C 12 65, 5 65, 0 70 Z"
                      fill="url(#petalE)" stroke="#a8536a" stroke-width="1.1" opacity="0.92"/>

                <!-- center stamen -->
                <ellipse cx="0" cy="-5" rx="9" ry="14" fill="#c8a35a" opacity="0.9"/>
                <line x1="-3" y1="-15" x2="-3" y2="6" stroke="#8a6a3a" stroke-width="0.9"/>
                <line x1="0"  y1="-18" x2="0"  y2="8" stroke="#8a6a3a" stroke-width="0.9"/>
                <line x1="3"  y1="-15" x2="3"  y2="6" stroke="#8a6a3a" stroke-width="0.9"/>
            </g>

            <!-- Smaller secondary bloom -->
            <g transform="translate(245, 220) rotate(20) scale(0.55)">
                <path d="M 0 -55 C -28 -50, -42 -25, -32 0 C -18 -8, -8 -25, 0 -45 Z"
                      fill="url(#petalC)" stroke="#a8536a" stroke-width="1" opacity="0.85"/>
                <path d="M 0 -55 C 28 -50, 42 -25, 32 0 C 18 -8, 8 -25, 0 -45 Z"
                      fill="url(#petalC)" stroke="#a8536a" stroke-width="1" opacity="0.85"/>
                <path d="M -45 -10 C -55 5, -50 30, -30 38 C -22 22, -25 5, -38 -8 Z"
                      fill="url(#petalD)" stroke="#a8536a" stroke-width="1" opacity="0.9"/>
                <path d="M 45 -10 C 55 5, 50 30, 30 38 C 22 22, 25 5, 38 -8 Z"
                      fill="url(#petalD)" stroke="#a8536a" stroke-width="1" opacity="0.9"/>
                <path d="M 0 5 C -22 12, -28 35, -10 50 C 0 45, 10 45, 20 50 C 32 35, 22 12, 0 5 Z"
                      fill="url(#petalE)" stroke="#a8536a" stroke-width="1.1" opacity="0.92"/>
                <ellipse cx="0" cy="-2" rx="6" ry="9" fill="#c8a35a" opacity="0.9"/>
            </g>

            <!-- Loose petals on the ground -->
            <g opacity="0.7">
                <path d="M 250 360 C 240 370, 245 385, 265 380 C 270 372, 265 362, 250 360 Z"
                      fill="url(#petalE)" stroke="#a8536a" stroke-width="0.8"/>
                <path d="M 300 380 C 290 388, 295 398, 312 392 C 316 386, 312 380, 300 380 Z"
                      fill="url(#petalE)" stroke="#a8536a" stroke-width="0.8"/>
            </g>
        </svg>
    </div>

    <div class="petals" id="petals"></div>
    <div class="hearts" id="hearts"></div>

    <main>
        <div class="card">
            <div class="frame"></div>

            <div class="occasion">Happy Mother's Day 2026</div>

            <h1 class="hero-name">Poonam</h1>

            <div class="divider"></div>

            <div class="message">
                <p><span class="accent">I love you, Poonam.</span></p>
                <p>You are my dream.</p>
                <p>Thank you for giving me my life &amp; my baby.</p>
                <p>I'm looking forward to a hundred more Mother's Days with you, celebrating my beautiful family with you.</p>
            </div>

            <div class="signature">Forever yours, Robin</div>
        </div>
    </main>

    <script>
        (function () {
            const heartColors = [
                '#e89eb1', '#f0a3b8', '#d56b85', '#aedbed', '#cfe9f5'
            ];
            const heartPath = 'M50 86 C50 86 14 60 14 36 C14 23 24 13 36 13 C43 13 48 17 50 23 C52 17 57 13 64 13 C76 13 86 23 86 36 C86 60 50 86 50 86 Z';

            const heartsRoot = document.getElementById('hearts');
            const drifts = ['drift1', 'drift2', 'drift3'];

            function spawnHeart() {
                const size = 28 + Math.random() * 50;
                const left = Math.random() * 100;
                const color = heartColors[Math.floor(Math.random() * heartColors.length)];
                const drift = drifts[Math.floor(Math.random() * drifts.length)];
                const duration = 14 + Math.random() * 10;

                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.width = size + 'px';
                heart.style.height = size + 'px';
                heart.style.left = left + 'vw';
                heart.style.bottom = '-' + size + 'px';
                heart.style.animation = `${drift} ${duration}s ease-in-out 1`;

                heart.innerHTML = `
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="${heartPath}" fill="${color}" opacity="0.55"/>
                    </svg>
                `;
                heartsRoot.appendChild(heart);
                heart.addEventListener('animationend', () => heart.remove());
            }

            // Falling petals
            const petalRoot = document.getElementById('petals');
            const petalColors = ['#f9c4d2', '#fbd6df', '#ffe0e9', '#aedbed'];
            const petalPath = 'M 30 5 C 10 15, 5 40, 20 55 C 30 60, 40 60, 50 55 C 65 40, 50 15, 30 5 Z';
            const fallAnims = ['fall1', 'fall2', 'fall3'];

            function spawnPetal() {
                const size = 22 + Math.random() * 30;
                const left = Math.random() * 100;
                const color = petalColors[Math.floor(Math.random() * petalColors.length)];
                const anim = fallAnims[Math.floor(Math.random() * fallAnims.length)];
                const duration = 11 + Math.random() * 9;

                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                petal.style.left = left + 'vw';
                petal.style.animation = `${anim} ${duration}s linear 1`;

                petal.innerHTML = `
                    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                        <path d="${petalPath}" fill="${color}" opacity="0.7" stroke="#a8536a" stroke-width="0.6" stroke-opacity="0.4"/>
                    </svg>
                `;
                petalRoot.appendChild(petal);
                petal.addEventListener('animationend', () => petal.remove());
            }

            // Initial sparse seeding
            for (let i = 0; i < 4; i++) setTimeout(spawnHeart, i * 800);
            for (let i = 0; i < 5; i++) setTimeout(spawnPetal, i * 600);

            // Slow, sparse cadence — keeps the page subtle
            setInterval(spawnHeart, 2400);
            setInterval(spawnPetal, 1700);
        })();
    </script>
</body>
</html>
